<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="yh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="yh-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="yh-doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="yh-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="25%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="1" />
      <stop offset="75%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <filter id="yh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Beveled Squircle Container -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#yh-bg)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" />
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Medical Cross -->
  <g opacity="0.9">
    <rect x="50" y="24" width="28" height="80" rx="7" fill="url(#yh-cross)" />
    <rect x="24" y="50" width="80" height="28" rx="7" fill="url(#yh-cross)" />
  </g>

  <!-- Folded Medical Chart -->
  <g filter="url(#yh-glow)">
    <rect x="49" y="35" width="40" height="56" rx="6" fill="#94A3B8" opacity="0.55" transform="rotate(6 69 63)" />
    <path d="M40 30 C40 26.686 42.686 24 46 24 H72 L88 40 V96 C88 99.314 85.314 102 82 102 H46 C42.686 102 40 99.314 40 96 V30 Z" fill="url(#yh-doc)" />
    <path d="M72 24 V36 C72 38.209 73.791 40 76 40 H88 Z" fill="#CBD5E1" />
    <rect x="48" y="47" width="28" height="4" rx="2" fill="#0284C7" />
    <rect x="48" y="57" width="32" height="3.5" rx="1.75" fill="#64748B" />
    <rect x="48" y="66" width="26" height="3.5" rx="1.75" fill="#64748B" />
    <rect x="48" y="75" width="30" height="3.5" rx="1.75" fill="#64748B" />
    <rect x="48" y="85" width="20" height="3" rx="1.5" fill="#0EA5E9" />
  </g>

  <!-- High-Tech Scan Laser Beam -->
  <g>
    <rect x="18" y="62" width="92" height="4" rx="2" fill="url(#yh-laser)" />
    <circle cx="64" cy="64" r="5" fill="#A5F3FC" />
    <circle cx="64" cy="64" r="2.5" fill="#FFFFFF" />
    <circle cx="32" cy="64" r="1.5" fill="#67E8F9" opacity="0.9" />
    <circle cx="96" cy="64" r="1.5" fill="#67E8F9" opacity="0.9" />
  </g>
</svg>
