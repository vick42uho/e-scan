# ==============================================================================
# Yanhee e-Scan System (DMS v3.1) - Frontend Server (10.200.120.31)
# Production Stack: Next.js 16 + Nginx Gateway (Proxy to Backend 10.200.120.33)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Next.js Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    image: yanhee-dms-frontend:latest
    container_name: yanhee-dms-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=/api/v1
      - TZ=Asia/Bangkok
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - frontend-network

  # ----------------------------------------------------------------------------
  # 2. Nginx Reverse Proxy Gateway
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: yanhee-dms-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - frontend-network

networks:
  frontend-network:
    name: yanhee-frontend-network
    driver: bridge
