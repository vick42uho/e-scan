# ==============================================================================
# Yanhee e-Scan System (DMS v3.1) - Frontend Server (10.200.120.31)
# Production Stack: Next.js 16 + Nginx Gateway (Proxy to Backend 10.200.120.33)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Next.js Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    image: yanhee-dms-frontend:latest
    container_name: yanhee-dms-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=/api/v1
      - TZ=Asia/Bangkok
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - frontend-network

  # ----------------------------------------------------------------------------
  # 2. Nginx Reverse Proxy Gateway
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: yanhee-dms-nginx
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8031}:80"
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-10.200.120.33}
      - BACKEND_PORT=${BACKEND_PORT:-8033}
      - NGINX_ENVSUBST_FILTER=BACKEND_.*
    volumes:
      - ./nginx/nginx.frontend.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - frontend-network

networks:
  frontend-network:
    name: yanhee-frontend-network
    driver: bridge
